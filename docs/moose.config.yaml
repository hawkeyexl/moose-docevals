# moose config for the documentation site itself.
#
# Separate from the repo-root moose.config.yaml on purpose. The root config
# runs against test/fixtures/pages/, which deliberately encodes failures so the
# CI gate is meaningful. This one runs against docs/src/content/docs/**, which
# must be all-green. Both run; neither replaces the other.
#
# See docs/content-strategy/information-architecture/proposed-ia.md
# ("Authoring convention: pages that show commands") and ADR 01004.
docevals:
  version: 1

  files:
    include:
      - "docs/src/content/docs/**/*.{md,mdx}"
    exclude:
      - "**/node_modules/**"

  defaults:
    # Every docs page gets this suite without repeating it in frontmatter. Pages
    # add an `evals:` block only when they need something page-specific.
    suite: docs-page-full
    fail-fast: false
    concurrency: 4

  provider:
    # Local inference: judging this corpus costs electricity, not tokens, which
    # is what makes a full re-judge after a PROMPT_VERSION bump an easy call
    # rather than a budget decision (ADR 01024).
    #
    # The model is PINNED and load-bearing. It is part of the judge cache key,
    # so changing it invalidates every committed fixture in
    # docs/.moose-docevals-cache/ and turns verify-docs red across all 34 pages
    # until they are regenerated. It is spelled out rather than left to the
    # config default for the same reason: a shifting default would silently
    # repartition the cache.
    #
    # A tier selector ("auto"/"fast"/"balanced"/"quality") is rejected here on
    # purpose — it resolves per-machine, which is the one property cache-key
    # material must not have.
    default: llama-cpp
    llama-cpp:
      # The `quality` tier. qwen3.5-4b was tried first and is not competent for
      # these assertions: it returned 9 false failures on no-future-promises,
      # three of them because the page quotes the eval's own `fail:` example
      # ("Says 'coming soon'") inside a YAML sample and the model read the
      # quotation as the page's own claim. Every wrong verdict was unanimous
      # 3/3 at 0.95 confidence, so consensus and the confidence zones could not
      # catch any of it.
      model: qwen3.5-9b
    anthropic:
      model: claude-sonnet-4-5
      api-key-env: ANTHROPIC_API_KEY
    claude-cli:
      model: claude-sonnet-4-5

  judge:
    ensemble-runs: 3
    # One at a time, because the judge is a local in-process llama.cpp model.
    # `defaults.concurrency: 4` above is right for the deterministic graders and
    # fatal here: four concurrent contexts against one GPU exhaust VRAM, and
    # every run fails with "A context size of N is too large for the available
    # VRAM" in about a millisecond. That is not a verdict, so those evals land
    # in human-review rather than passing — the invariant held, but 65 of 68
    # evals were unusable. See ADR 01027.
    concurrency: 1
    temperature: 0
    zones:
      auto-pass: 0.8
      auto-fail: 0.8
    false-positive-alert: 0.15
    # Committed, not gitignored. The repo-root .gitignore excludes `.moose-docevals/`,
    # so the docs corpus keeps its cache somewhere version-controlled — that is
    # what lets the verify-docs CI job replay LLM verdicts with no API key.
    # Regenerate with `npm run docs:refresh-cache` after any PROMPT_VERSION bump.
    cache-dir: docs/.moose-docevals-cache
    # A safety net, not a throttle. A green verify-docs run replays committed
    # cache fixtures and makes no inference calls, so this never trips there.
    # It bounds the *regeneration* path: `npm run docs:refresh-cache` judges
    # every page cold.
    #
    # Sized well above a full cold run on purpose. Budget exhaustion is a
    # warning and skipped evals leave the suite passing, so a cap set *below*
    # what a refresh needs would exit 0 having written a partial cache — which
    # then gets committed and replayed as though it were complete. The whole
    # docs-page-full set is ~34 pages x 2 ai evals x 3 runs = ~204 turns.
    max-turns: 600

  fill:
    cache-dir: docs/.moose-docevals-cache/fill
    # One call per page; ~34 pages. Generous for the same reason as above.
    max-turns: 200

  scripts:
    dir: "{docDir}/moose-docevals"
    config-dir: moose-docevals-scripts
    # The docs corpus declares no frontmatter commands. Command execution here
    # comes from the tool:doc-detective grader running steps embedded in page
    # bodies, which this flag does NOT gate — the verify-docs job is restricted to
    # same-repo pull requests instead. See docs/src/content/docs/ci/
    # untrusted-pull-requests.mdx (planned) and ADR 01004.
    allow-frontmatter-commands: false
    timeout-ms: 60000

  evals:
    # --- Deterministic. These run offline with no provider. ---
    commands-work:
      assertion: >
        Every command the page presents runs and produces the documented result.
      grader: tool:doc-detective
      options:
        # Only the config path is overridden — the grader's default argv is
        # correct as of ADR 01005. It appends `--input <file>`.
        #
        # No --allow-unsafe: the inline steps invoke the moose-docevals CLI via
        # runShell, which Doc Detective permits by default. Adding it would widen
        # what a content file can execute for no benefit. See ADR 01005.
        command: ["npx", "--no-install", "doc-detective", "--config", ".doc-detective.json"]
      severity: error

    frontmatter-valid:
      assertion: Page frontmatter validates against the moose-docevals frontmatter schema.
      grader: tool:docmeta
      options:
        schemas: ["schemas/frontmatter-1.0.0.json"]
      severity: error

    markdownlint:
      assertion: Page passes markdownlint style rules.
      grader: tool:markdownlint
      severity: warning

    # --- LLM-graded. In the suite as of ADR 01025. ---
    # These were held back while the site was section-index stubs, because
    # judging placeholder prose produces cache fixtures that assert nothing.
    # All 34 pages are written now, so a red verify-docs means the *prose*
    # failed, not only that a command broke. Regenerate the committed fixtures
    # with `npm run docs:refresh-cache` after any PROMPT_VERSION bump.
    # The scope sentence is load-bearing, not padding. Without it, both
    # qwen3.5-4b and qwen3.5-9b failed the pages that *document this very eval*,
    # because those pages quote a `fail:` example containing the words "coming
    # soon" inside a YAML sample. The 9b run named the problem in its own
    # reasoning — "mentions unreleased functionality in the example of a failing
    # eval" — and failed the page anyway. It was right to: the old wording never
    # said whether quoted text counts as the page's own claim, so no model could
    # resolve it. See `evals/write-good-assertions.mdx`.
    no-future-promises:
      type: regression
      assertion: >
        The page's own prose makes no claims about unreleased or future
        functionality. Text inside fenced code blocks, configuration samples,
        and quoted examples is illustration rather than something the page is
        claiming, and does not count.
      grader: ai
      evidence: Prose outside fenced code blocks and quoted examples
      examples:
        pass: >
          Describes only shipped behavior. A code sample or quoted example that
          happens to contain future-tense wording is still a pass.
        fail: >
          The page's own prose promises a feature that has not shipped, or
          points the reader at an unreleased version.

    # Renamed from `serves-one-journey`, which was wrong twice over.
    #
    # First, the name asserted a constraint the IA does not want: the delivery
    # record in ia-gap-analysis.md deliberately assigns three CUJs to
    # judge/index.mdx and reference/frontmatter.mdx, and two to reference/cli.mdx
    # and reference/configuration.mdx. Pages are supposed to serve more than one
    # journey.
    #
    # Second, the name never described the assertion. It has always tested
    # whether a page says what it is for near the top; it has never counted
    # journeys. Asking for a *journey outcome* is also why every reference page
    # failed — a lookup surface has no journey, but it certainly has a purpose,
    # and "every command, argument, and flag" states it exactly.
    states-its-purpose:
      type: capability
      assertion: >
        Near the top, the page makes clear what it is for — the outcome a
        reader reaches, the job it does, or the ground it covers. Naming the
        outcome, stating what is at stake, or describing the scope all satisfy
        this. The page does not have to use "you will be able to" phrasing.
      grader: ai
      evidence: Title, description, and the first section
      examples:
        pass: >
          Opens by naming the outcome ("Zero to a real finding"), the stake
          ("A gate that is not in CI is a linter someone runs sometimes"), or
          the scope ("Every command, argument, and flag").
        fail: >
          Opens with a definition, a feature list, or a configuration dump, and
          never makes clear what the page is for.

    readable:
      assertion: Page prose reads below grade 12.
      grader: tool:reading-level
      options:
        max-grade: 12
      severity: warning

  suites:
    # Deterministic only. Kept as the escape hatch for a run that must not
    # touch the judge at all — `--suite docs-page` needs no cache and no model.
    docs-page:
      target-pass-rate: 1.0
      evals: [commands-work, frontmatter-valid, markdownlint]

    # The default (see defaults.suite): deterministic checks plus the judge.
    #
    # `states-its-purpose` is deliberately NOT here. It is defined above and
    # still runnable with `--eval states-its-purpose`, but a local judge cannot
    # evaluate it stably: broadening the assertion (adding "or the ground it
    # covers", which accepts strictly more pages) moved four pages from pass to
    # FAIL. The eval name never reaches the prompt, so nothing else changed.
    # Verdicts that are not a monotonic function of the assertion are not
    # measuring the assertion, and no further rewording fixes that — see
    # ADR 01028. `no-future-promises` sits at 33/34 across three wordings,
    # which is the difference between a locatable property and a holistic one.
    docs-page-full:
      target-pass-rate: 1.0
      evals:
        [commands-work, frontmatter-valid, markdownlint, readable, no-future-promises]

    # For pages that document an eval in their own prose. `no-future-promises`
    # cannot judge `evals/regression-vs-capability.mdx`, whose body contains the
    # sentence "no promises about unreleased features" as an *example* of what a
    # regression eval guards. The scope sentence in the assertion exempts code
    # blocks and quoted examples; this is neither. Narrower than skipping the
    # page: everything else still runs.
    docs-page-meta:
      target-pass-rate: 1.0
      evals: [commands-work, frontmatter-valid, markdownlint, readable]
