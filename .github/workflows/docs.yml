name: Docs

# Build the Starlight docs site and publish it to GitHub Pages on every push to
# main. The deploy is gated on moose-docevals evaluating its own documentation: if a
# documented command drifts from the code, or a page's frontmatter stops
# validating, the site does not ship.
#
# This repeats the `verify-docs` job from ci.yml rather than depending on it.
# The duplication is deliberate: `main` has no ruleset requiring pull requests,
# so a direct push would otherwise reach `deploy` without ever having been
# verified. Self-contained beats fast for the job that publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. `pages: write` and the OIDC `id-token: write`
# that deploy-pages needs are granted on the deploy job alone, so verify-docs —
# which executes commands embedded in page bodies — and build never hold a token
# that can publish.
permissions:
  contents: read

# Only one Pages deploy at a time; let an in-flight run finish rather than
# cancelling it (avoids leaving Pages in a half-deployed state).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Dogfood: run moose-docevals over its own documentation. The tool:doc-detective
  # grader executes the inline steps embedded in each page, so the commands the
  # docs present are run against the committed fixture corpus.
  #
  # No fork gate here (unlike ci.yml's verify-docs) because this workflow only
  # triggers on push to main and manual dispatch — never on pull_request — so
  # the content being executed is always already in the repository.
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm install, not ci — see the note in ci.yml. The lockfile is authored
      # on Windows and `npm ci` fails its sync check on every runner.
      - run: npm install --no-fund --no-audit
      - run: npm run build

      # Expose the freshly built CLI as the `moose-docevals` command the docs invoke.
      # dist/ is gitignored and the package is unpublished, so without these the
      # documented commands have nothing to resolve.
      - run: npm link
      - run: npm link moose-docevals

      # Guard against silent zero-coverage: a step with a typo'd key is reported
      # "isn't a valid step. Skipping.", and a page whose steps are all invalid
      # yields no tests, exit 0, and a passing eval. Green with nothing run.
      - name: Assert every inline doc-detective step is valid
        run: |
          set -o pipefail
          mkdir -p .tmp
          npx --no-install doc-detective --config .doc-detective.json --dry-run \
            2>&1 | grep -v '^strict mode:' > .tmp/dd-resolve.log || true
          invalid=$(grep -c "isn't a valid step" .tmp/dd-resolve.log || true)
          if [ "${invalid:-0}" -ne 0 ]; then
            echo "::error::${invalid} inline doc-detective step(s) failed to parse — they are silently skipped, not run."
            grep "isn't a valid step" .tmp/dd-resolve.log
            exit 1
          fi
          echo "All inline steps parsed."

      # No ANTHROPIC_API_KEY: the docs-page suite is deterministic today, and
      # judged evals replay from the committed cache in docs/.moose-docevals-cache/
      # once they join the suite.
      - name: Verify docs (moose-docevals over the docs site)
        run: npm run docs:verify -- --format github

  # Build the Astro/Starlight static site and upload it as a Pages artifact.
  build:
    needs: verify-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        run: npm install --no-fund --no-audit
        working-directory: docs
      - name: Build docs site
        run: npm run build
        working-directory: docs

      # `moose-docevals run` checks that a page's commands are true; nothing checks
      # that its links are. ~1,350 internal links across the content set, so one
      # renamed route silently ships dozens of 404s — the build succeeds either
      # way. Gate the deploy on it.
      - name: Check internal links resolve
        run: node scripts/check-docs-links.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  # Deploy the uploaded artifact to GitHub Pages. The only job that can publish,
  # and the only one holding the tokens to do so.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
