name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # moose-docevals shells out to external tools (remark, Vale, generated
    # check scripts), and the spawn path is genuinely platform-specific:
    # exec.ts leans on cross-spawn to resolve npm `.cmd` shims on Windows, and
    # frontmatter-edit.ts preserves CRLF. Both are developed on Windows and
    # deployed in Linux CI, so test the pair rather than trusting one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # `npm ci`, not install. This job ran `npm install` for months on the
      # theory that the lockfile was mis-authored on Windows and `npm ci` could
      # never pass. The real cause was npm <= 11.6.2 dropping the top-level
      # entries for an optional package's peer dependencies (@emnapi/*, reached
      # through @rolldown/binding-wasm32-wasi) on every platform. Both lockfiles
      # have been regenerated by a newer npm, and `npm run check:deps` — which
      # runs before typecheck, build and test — asserts the >= 11.6.3 floor so
      # the fault cannot come back unnamed.
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      # Type-aware lint. What it catches that tsc does not is an *inferred*
      # `any` crossing a boundary — a commander callback parameter, a
      # JSON.parse — which never appears as the word `any` in the source.
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # The published schema's $id is a URL consumers point validators at, so
      # the copy the docs site serves must be the copy the package ships. This
      # is the local half; published-schemas.yml fetches the URL for real.
      - run: npm run schemas:check

      # The suite mocks the judge provider and injects a fake exec, so it never
      # reaches the network. Prove the CLI itself works end to end against the
      # fixture corpus using only deterministic graders — this is what would
      # catch a broken bin entry, a bad dist build, or a grader that only works
      # under vitest's module resolution.
      # Exit 1 is the expected, asserted outcome: goTo.mdx deliberately carries
      # a stale review date at error severity.
      - name: Dogfood run (deterministic graders)
        shell: bash
        # Report path is relative on purpose. On windows-latest this runs under
        # Git Bash, which maps an absolute POSIX path like /tmp to its own root,
        # while node.exe resolves the same literal string against the current
        # drive (D:\tmp) — so the write and the read land in different places.
        # A relative path resolves identically for both.
        run: |
          set +e
          node dist/cli.js run --deterministic-only --no-generate --format json > moose-docevals-run.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 from the fixture corpus, got $code"
            cat moose-docevals-run.json
            exit 1
          fi
          node -e '
            let raw = require("fs").readFileSync("moose-docevals-run.json", "utf8");
            if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1); // tolerate a BOM
            const r = JSON.parse(raw);
            const find = (f, e) => r.evalResults.find((x) => x.file.endsWith(f) && x.evalName === e);
            const check = (label, actual, expected) => {
              if (actual !== expected) {
                console.error(`${label}: expected ${expected}, got ${actual}`);
                process.exitCode = 1;
              }
            };
            // The pre-generated fixture script runs and passes.
            check("find.mdx has-examples-heading", find("find.mdx", "has-examples-heading")?.outcome, "pass");
            // Severity-overridden freshness fails; warning-severity does not.
            check("goTo.mdx fresh-enough", find("goTo.mdx", "fresh-enough")?.outcome, "fail");
            check("concepts.md fresh-enough", find("concepts.md", "fresh-enough")?.outcome, "pass");
            // moose-docevals validates its own frontmatter through published docmeta.
            const fm = r.evalResults.filter((x) => x.evalName === "frontmatter-valid");
            if (fm.length === 0) { console.error("no frontmatter-valid results"); process.exitCode = 1; }
            for (const x of fm) check(`${x.file} frontmatter-valid`, x.outcome, "pass");
            // The deterministic rungs below the judge run over the real corpus.
            const named = r.evalResults.filter((x) => x.evalName === "names-an-action");
            if (named.length === 0) { console.error("no names-an-action results"); process.exitCode = 1; }
            for (const x of named) {
              check(`${x.file} names-an-action`, x.outcome, "pass");
              // A secondary check carries its declared weight into the rate.
              check(`${x.file} names-an-action weight`, x.weight, 0.5);
            }
            for (const x of r.evalResults.filter((x) => x.evalName === "ships-a-schema")) {
              check(`${x.file} ships-a-schema`, x.outcome, "pass");
            }
            // A criterion is scored once per page, and its members do not also
            // vote — goTo.mdx fails freshness, so exactly one criterion fails.
            const ref = r.suites.find((s) => s.suite === "reference");
            check("reference criteria failed", ref?.criteria?.failed, 1);
            check("reference criteria suspended", ref?.criteria?.suspended, 0);
          '

      # The HTML report is what a documentation owner actually opens, so it has
      # to be self-contained: a CI artifact that reaches for a CDN renders
      # unstyled, and one that reaches anywhere at all is a report that leaks
      # where it was opened.
      # Written to a file through a quoted heredoc rather than passed to
      # `node -e '...'`: the check needs to match an apostrophe (it looks for
      # src/href="http and src/href='http), and an apostrophe inside a
      # single-quoted shell argument closes it and hands the rest of the
      # script to the shell. That is a syntax error, not a failed assertion,
      # so the step fails identically whatever the report contains.
      - name: HTML report is self-contained
        run: |
          node dist/cli.js run --deterministic-only --no-generate --format html > moose-docevals.html || true
          cat > check-html.mjs <<'CHECK'
          import { readFileSync } from "node:fs";

          const html = readFileSync("moose-docevals.html", "utf8");
          const externals = html.match(/(src|href)\s*=\s*["']https?:/gi) ?? [];
          if (externals.length > 0) {
            console.error("HTML report references external resources:", externals);
            process.exitCode = 1;
          }
          for (const needle of ["<!doctype html>", "moose-docevals results", "Suites"]) {
            if (!html.includes(needle)) {
              console.error(`HTML report missing ${needle}`);
              process.exitCode = 1;
            }
          }
          CHECK
          node check-html.mjs

      # ADR 01007. An unrecognized --format used to fall through to the human
      # renderer (list, fill) or print the literal string "undefined" (run), in
      # both cases exiting 0. Assert the usage-error contract through the built
      # CLI, on both runners, for every command that takes the flag.
      - name: Dogfood usage errors (--format validation)
        shell: bash
        run: |
          check_two() {
            set +e
            out=$("$@" 2>&1)
            code=$?
            set -e
            if [ "$code" -ne 2 ]; then
              echo "Expected exit 2 from: $* — got $code"
              echo "$out"
              exit 1
            fi
            case "$out" in
              *"must be one of"*) ;;
              *) echo "Expected an allowed-set message from: $* — got: $out"; exit 1 ;;
            esac
          }
          check_two node dist/cli.js list test/fixtures/pages/docs/actions/find.mdx --format xml
          check_two node dist/cli.js run test/fixtures/pages/docs/actions/find.mdx --deterministic-only --format xml
          check_two node dist/cli.js fill --dry-run --format xml
          # markdown is a `run` format; `list` must reject it, not fall back.
          check_two node dist/cli.js list test/fixtures/pages/docs/actions/find.mdx --format markdown

      # A malformed SARIF log uploads and then matches no file; malformed
      # JUnit XML makes a CI system report "no tests" instead of the failure it
      # was handed. Both fail silently in the place they are meant to help, so
      # parse what the built CLI actually emits.
      # Both formats fail *silently* in the place they are meant to help: a
      # SARIF log with a non-repo-relative URI uploads fine and annotates
      # nothing, and invalid JUnit XML makes a CI system report "no tests
      # found" rather than the failure it was handed. So read the bytes.
      - name: Dogfood the CI reporters (sarif, junit)
        shell: bash
        run: |
          # Exit 1 is the corpus doing its job, not a failure of the reporter.
          set +e
          node dist/cli.js run --deterministic-only --no-generate --format sarif > moose-docevals.sarif
          node dist/cli.js run --deterministic-only --no-generate --format junit > moose-docevals.junit.xml
          set -e
          node scripts/check-ci-reports.mjs moose-docevals.sarif moose-docevals.junit.xml
          rm -f moose-docevals.sarif moose-docevals.junit.xml

      # An empty input set is an operational error, not a green run. The unit
      # suite pins that discoverPages throws; this pins that the exit code
      # survives the trip through the CLI, which is where a stray catch would
      # turn "nothing was checked" into a passing build.
      - name: Dogfood the empty-input contract
        shell: bash
        run: |
          expect_exit_2() {
            set +e
            out=$("$@" 2>&1)
            code=$?
            set -e
            if [ "$code" -ne 2 ]; then
              echo "Expected exit 2 from: $* — got $code"
              echo "$out"
              exit 1
            fi
            case "$out" in
              *"No documentation pages found"*) ;;
              *) echo "Expected the empty-input message from: $* — got: $out"; exit 1 ;;
            esac
          }
          expect_exit_2 node dist/cli.js run does/not/exist/'**'/*.md --deterministic-only
          expect_exit_2 node dist/cli.js list does/not/exist/'**'/*.md
          # An explicitly named file that does not exist is the same failure,
          # and the easier one to accidentally treat as "zero matches, fine".
          expect_exit_2 node dist/cli.js list does/not/exist.md

      # ADR 01008. Both failure modes here are silent by construction: a config
      # the loader does not recognize yields a defaults-only run with no evals
      # and no suites, and exits 0. Unit tests cover the loader; this asserts
      # the same contract through the built CLI, where `init` and `list` meet.
      #
      # Relative paths only — see the note on the dogfood step above.
      - name: Dogfood the moose config contract
        shell: bash
        run: |
          rm -rf .ci-config-check
          mkdir -p .ci-config-check/docs
          printf -- '---\ntitle: Sample\nlast-reviewed: 2026-08-01\nevals:\n  - use: fresh-enough\n---\n\n# Sample\n\nBody.\n' \
            > .ci-config-check/docs/page.md
          cd .ci-config-check
          node ../dist/cli.js init
          # The scaffold must be namespaced, or every named eval silently vanishes.
          grep -q '^docevals:$' moose.config.yaml \
            || { echo "init scaffolded a config with no docevals: namespace"; cat moose.config.yaml; exit 1; }
          # ...and the named eval it defines must actually resolve.
          out=$(node ../dist/cli.js list)
          case "$out" in
            *"fresh-enough"*) ;;
            *) echo "scaffolded config resolved no named evals — got: $out"; exit 1 ;;
          esac
          expect_usage_error() {
            set +e
            out=$("$@" 2>&1)
            code=$?
            set -e
            if [ "$code" -ne 2 ]; then
              echo "Expected exit 2 from: $* — got $code"
              echo "$out"
              exit 1
            fi
            case "$out" in
              *"docevals:"*) ;;
              *) echo "Expected the migration message to name the namespace — got: $out"; exit 1 ;;
            esac
          }
          # Guard 1, by filename: a pre-rename name in cwd must stop the run.
          mv moose.config.yaml docevals.config.yaml
          expect_usage_error node ../dist/cli.js run --deterministic-only
          # Guard 2, by shape: --config never reaches the filename check, so an
          # unmigrated *flat* config has to be caught on its keys. Without this
          # the run exits 0 having resolved nothing at all.
          printf 'version: 1\nfiles:\n  include: ["docs/**/*.md"]\n' > flat.yaml
          expect_usage_error node ../dist/cli.js run -c flat.yaml --deterministic-only
          # ADR 01019. `max-cost-usd` was removed, not renamed, so an
          # unmigrated config has to stop the run naming the dead key. The
          # failure mode this guards is the quiet one: were the `docevals:`
          # subtree not strict, the ceiling would simply never apply and the
          # run would go green having bounded nothing.
          expect_dead_key() {
            set +e
            out=$(node ../dist/cli.js run -c "$1" --deterministic-only 2>&1)
            code=$?
            set -e
            if [ "$code" -ne 2 ]; then
              echo "Expected exit 2 for a config carrying max-cost-usd ($1) - got $code"
              echo "$out"
              exit 1
            fi
            case "$out" in
              *max-cost-usd*) ;;
              *) echo "Expected the error to name max-cost-usd - got: $out"; exit 1 ;;
            esac
          }
          # Built with echo rather than a multi-line printf: this file is
          # YAML, and an embedded newline would end the block scalar.
          { echo 'docevals:'; echo '  version: 1'; echo '  judge:'; echo '    max-cost-usd: 2'; } > dead-judge.yaml
          { echo 'docevals:'; echo '  version: 1'; echo '  fill:'; echo '    max-cost-usd: 2'; } > dead-fill.yaml
          expect_dead_key dead-judge.yaml
          expect_dead_key dead-fill.yaml
          # ...and the flag that replaced it rejects a value below its floor
          # rather than quietly reading it as unbounded.
          set +e
          out=$(node ../dist/cli.js run --max-turns 0 --deterministic-only 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected exit 2 from --max-turns 0 - got $code"; echo "$out"; exit 1
          fi
          case "$out" in
            *positive*) ;;
            *) echo "Expected --max-turns 0 to be rejected as non-positive - got: $out"; exit 1 ;;
          esac
          cd ..
          rm -rf .ci-config-check

      # ADR 01016. The calibration loop only closes if seeding runs where
      # there is no API key, so assert exactly that: `--seed` reads recorded
      # reviews and writes candidates without ever constructing a provider.
      # The second assertion is the gate itself -- a seeded case must land
      # unreviewed, because a golden set assembled without a human is not one.
      - name: Dogfood the review -> golden seed loop
        shell: bash
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          rm -rf .ci-seed-check
          mkdir -p .ci-seed-check/docs
          cd .ci-seed-check
          { echo '---'; echo 'title: Install'; echo 'evals:'; echo '  - use: no-future-promises'; echo '---'; echo; echo 'Body text.'; } > docs/install.md
          { echo 'docevals:'; echo '  version: 1'; echo '  files:'; echo '    include: ["docs/**/*.md"]'; echo '  evals:'; echo '    no-future-promises:'; echo '      assertion: The page makes no claims about unreleased functionality.'; echo '      grader: ai'; } > moose.config.yaml
          node ../dist/cli.js review docs/install.md no-future-promises pass --reviewer ci
          out=$(node ../dist/cli.js calibrate --seed 2>&1)
          echo "$out"
          case "$out" in
            *"golden candidate"*) ;;
            *) echo "::error::calibrate --seed wrote nothing"; exit 1 ;;
          esac
          seeded=.moose-docevals/golden/from-reviews.yaml
          if ! grep -q "reviewed: false" "$seeded"; then echo "::error::a seeded golden case must land unreviewed"; cat "$seeded"; exit 1; fi
          if ! grep -q "source: review" "$seeded"; then echo "::error::a seeded case must record where it came from"; cat "$seeded"; exit 1; fi
          if ! grep -q "content-hash:" "$seeded"; then echo "::error::a seeded case must carry the hash it was verified against"; cat "$seeded"; exit 1; fi
          # A second seed over the same reviews changes nothing, and has to
          # say so: `updated` counted every case the file already held, so a
          # no-op re-seed reported movement that never happened.
          again=$(node ../dist/cli.js calibrate --seed 2>&1)
          echo "$again"
          case "$again" in
            *"No new reviews to seed"*) ;;
            *) echo "::error::a no-op re-seed must report no changes - got: $again"; exit 1 ;;
          esac
          cd ..
          rm -rf .ci-seed-check

      # `promote` built its provider before checking whether it had anything
      # to assess, so a corpus with no ai-graded evals demanded an API key to
      # be told there was nothing to do. Assert the lazy path through the
      # built CLI with no key present.
      - name: Dogfood promote with nothing to promote
        shell: bash
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          rm -rf .ci-promote-check
          mkdir -p .ci-promote-check/docs
          cd .ci-promote-check
          { echo '---'; echo 'title: Install'; echo 'last-reviewed: 2026-08-01'; echo 'evals:'; echo '  - id: fresh-enough'; echo '    assertion: Reviewed recently.'; echo '    grader: tool:freshness'; echo '---'; echo; echo 'Body.'; } > docs/install.md
          { echo 'docevals:'; echo '  version: 1'; echo '  files:'; echo '    include: ["docs/**/*.md"]'; } > moose.config.yaml
          out=$(node ../dist/cli.js promote 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then echo "::error::promote with nothing to assess should exit 0, got $code"; exit 1; fi
          case "$out" in
            *"No ai-graded evals found"*) ;;
            *) echo "::error::expected the no-op message, got: $out"; exit 1 ;;
          esac
          cd ..
          rm -rf .ci-promote-check

      # ADR 01018. The dangerous half of selection is not the filtering, it is
      # the exit code: a run narrowed to one passing eval computes 1/1 against
      # its suite target and would otherwise exit 0 having checked almost
      # nothing. Assert the whole contract through the built CLI.
      - name: Dogfood eval and suite selection
        shell: bash
        run: |
          expect_code() {
            want=$1; shift
            set +e
            out=$("$@" 2>&1); code=$?
            set -e
            if [ "$code" -ne "$want" ]; then
              echo "::error::expected exit $want from: $* - got $code"; echo "$out"; exit 1
            fi
            printf "%s" "$out"
          }
          # A filter that matches nothing is a usage error, never a green run
          # over zero evals.
          expect_code 2 node dist/cli.js run --deterministic-only --eval no-such-eval > /dev/null
          expect_code 2 node dist/cli.js run --deterministic-only --suite no-such-suite > /dev/null
          # An all-passing filtered run exits 0 but must not claim a target was
          # met on evidence it never gathered.
          out=$(expect_code 0 node dist/cli.js run --deterministic-only --no-generate --eval readable)
          echo "$out"
          case "$out" in
            *partial*) ;;
            *) echo "::error::a filtered run must mark its suites partial"; exit 1 ;;
          esac
          case "$out" in
            *"vs target"*ok*) echo "::error::a filtered run reported a suite target as met"; exit 1 ;;
            *) ;;
          esac
          # A genuine failure inside the filter still fails the run.
          expect_code 1 node dist/cli.js run --deterministic-only --no-generate --eval fresh-enough > /dev/null
          # A variadic --eval would swallow the glob and silently widen the run
          # to the whole corpus; the flag is repeatable-single instead.
          out=$(expect_code 0 node dist/cli.js list --eval fresh-enough test/fixtures/pages/docs/actions/goTo.mdx)
          case "$out" in
            *"1 pages"*) ;;
            *) echo "::error::--eval swallowed the positional glob: $out"; exit 1 ;;
          esac
          # ...and it accumulates rather than replacing.
          out=$(expect_code 0 node dist/cli.js list --eval fresh-enough --eval readable test/fixtures/pages/docs/actions/goTo.mdx)
          case "$out" in
            *"2 evals resolved"*) ;;
            *) echo "::error::--eval is not repeatable: $out"; exit 1 ;;
          esac

      # ADR 01017. The ratchet is only useful if a recorded finding actually
      # stops failing the build, and only *safe* if a re-record says what it
      # dropped. Both are asserted here, in a scratch corpus so nothing is
      # written into the repo.
      - name: Dogfood the baseline ratchet
        shell: bash
        run: |
          rm -rf .ci-baseline-check
          mkdir -p .ci-baseline-check/docs
          cd .ci-baseline-check
          { echo '---'; echo 'title: Legacy'; echo 'last-reviewed: 1999-01-01'; echo 'evals:'; echo '  - use: fresh-enough'; echo '---'; echo; echo 'Old.'; } > docs/legacy.md
          { echo 'docevals:'; echo '  version: 1'; echo '  baseline: .moose-docevals-baseline.json'; echo '  files:'; echo '    include: ["docs/**/*.md"]'; echo '  evals:'; echo '    fresh-enough:'; echo '      assertion: Reviewed recently.'; echo '      grader: tool:freshness'; echo '      options:'; echo '        field: last-reviewed'; echo '        max-age-days: 365'; echo '      severity: error'; } > moose.config.yaml
          # Red before the baseline exists.
          set +e; node ../dist/cli.js run > /dev/null 2>&1; code=$?; set -e
          if [ "$code" -ne 1 ]; then echo "::error::expected exit 1 before recording, got $code"; exit 1; fi
          # Record it, then the same corpus is green.
          out=$(node ../dist/cli.js run --write-baseline 2>&1); echo "$out"
          case "$out" in
            *"recorded 1 finding"*) ;;
            *) echo "::error::--write-baseline did not report what it recorded"; exit 1 ;;
          esac
          set +e; node ../dist/cli.js run > /dev/null 2>&1; code=$?; set -e
          if [ "$code" -ne 0 ]; then echo "::error::a recorded finding must not fail the run, got $code"; exit 1; fi
          # --no-baseline puts the finding back.
          set +e; node ../dist/cli.js run --no-baseline > /dev/null 2>&1; code=$?; set -e
          if [ "$code" -ne 1 ]; then echo "::error::--no-baseline must ignore the recorded finding, got $code"; exit 1; fi
          # A hand-broken baseline is rejected, not ignored.
          cp .moose-docevals-baseline.json good.json
          echo '{"version":1,"entries":{"docs/legacy.md":["nope"]}}' > .moose-docevals-baseline.json
          set +e; out=$(node ../dist/cli.js run 2>&1); code=$?; set -e
          if [ "$code" -ne 2 ]; then echo "::error::a malformed baseline must exit 2, got $code"; echo "$out"; exit 1; fi
          case "$out" in
            *nope*) ;;
            *) echo "::error::the error must name the malformed entry - got: $out"; exit 1 ;;
          esac
          cd ..
          rm -rf .ci-baseline-check

  # Verify the documentation site: moose-docevals runs over docs/src/content/docs/**,
  # where the tool:doc-detective grader executes the inline test steps embedded
  # in each page. A documented command that drifts from the code fails here.
  #
  # Unlike the fixture corpus above, this one must be all-green — the two gates
  # are complementary, not redundant. See docs/content-strategy/
  # information-architecture/proposed-ia.md and ADR 01004.
  verify-docs:
    runs-on: ubuntu-latest
    # SECURITY GATE — do not remove. The doc-detective grader runs shell
    # commands embedded in page *bodies*, so a fork pull request could execute
    # its author's code on this runner. `scripts.allowFrontmatterCommands:
    # false` in docs/moose.config.yaml does NOT cover that path — it only
    # gates commands declared in frontmatter. Restricting the job to same-repo
    # pull requests is the complete answer.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run build

      # Expose the freshly built CLI as the `moose-docevals` command the docs invoke.
      # `npm link` puts it on PATH for a bare `moose-docevals ...`; `npm link
      # moose-docevals` adds node_modules/.bin/moose-docevals so `npx moose-docevals
      # ...` resolves the local build. dist/ is gitignored and the package is
      # unpublished, so without these the documented commands have nothing to
      # run.
      - run: npm link
      - run: npm link moose-docevals

      # Guard against silent zero-coverage. A step with a typo'd key (`stdout`
      # instead of `stdio`) is reported "isn't a valid step. Skipping." — and if
      # every step on a page is invalid, doc-detective finds no tests, exits 0,
      # and the eval passes. Green with nothing executed. Fail loudly instead.
      - name: Assert every inline doc-detective step is valid
        run: |
          set -o pipefail
          mkdir -p .tmp
          npx --no-install doc-detective --config .doc-detective.json --dry-run \
            2>&1 | grep -v '^strict mode:' > .tmp/dd-resolve.log || true
          invalid=$(grep -c "isn't a valid step" .tmp/dd-resolve.log || true)
          if [ "${invalid:-0}" -ne 0 ]; then
            echo "::error::${invalid} inline doc-detective step(s) failed to parse — they are silently skipped, not run."
            grep "isn't a valid step" .tmp/dd-resolve.log
            exit 1
          fi
          echo "All inline steps parsed."

      # No ANTHROPIC_API_KEY is set, deliberately. The docs-page suite is
      # deterministic today, and judged evals replay from the committed cache in
      # docs/.moose-docevals-cache/ once they join the suite. A cache miss surfaces as
      # a provider error, so a green run here proves the fixtures are real.
      - name: Verify docs (moose-docevals over the docs site)
        run: npm run docs:verify -- --format github

      # Catch Astro/Starlight breakage — a page can pass its evals and still
      # fail to build (bad MDX, a broken component import). No second
      # setup-node: Node 24 is already installed, and a second `cache: npm`
      # step in the same job registers a competing post-run cache save.
      - run: npm ci --no-fund --no-audit
        working-directory: docs
      - run: npm run build
        working-directory: docs

      # One renamed route silently ships dozens of 404s; the build succeeds
      # either way, and no eval covers links.
      - name: Check internal links resolve
        run: node scripts/check-docs-links.mjs
