name: Vale

# Prose lint against the Moose house voice (Voices + Direct). Blocking: the
# whole corpus is at zero alerts, so `nofilter` reports every alert in the
# checkout rather than only the lines a pull request adds, and an error fails
# the check. See ADR 01044 for why the gate is whole-file rather than
# diff-scoped, and `.vale.ini` for the one path that is exempt.
on:
  pull_request:
    paths:
      - "**.md"
      - "**.mdx"
      - ".vale.ini"

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          version: 3.20.0
          reporter: github-pr-review
          filter_mode: nofilter
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
