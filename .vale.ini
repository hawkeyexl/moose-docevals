# House voice for every document in this repo. The Moose package enables the
# Voices core, the Direct voice, and the Moose house rules for all Markdown
# and text files. README, ADRs, CLAUDE.md, and the docs site are all held to
# the same voice; the one exemption is the vendored fixture corpus below.
# Package source: https://github.com/hawkeyexl/moose-vale
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/hawkeyexl/moose-vale/releases/latest/download/Moose.zip

# `test/fixtures/pages/` is a vendored snapshot of doc-detective's docs,
# annotated with moose-docevals frontmatter. It is somebody else's prose, kept
# deliberately close to upstream so it can be re-synced, and CI asserts
# specific eval outcomes against it. It is corpus, not copy. Holding it to
# this repo's voice would fail the gate on every refresh from upstream and
# invite edits that drift the fixtures from the pages they mirror.
[test/fixtures/pages/**]
BasedOnStyles =
